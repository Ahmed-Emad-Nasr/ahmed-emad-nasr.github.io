<script>
  /* Any address at the root that does not exist here (/blog, /teaching,
     /blog/<case>, /ar/teaching…) → the same page in the portfolio at
     /ahmed.dev/, keeping ?query and #anchor */
  var p = location.pathname;
  if (!/^\/ahmed\.dev(\/|$)/i.test(p)) {
    location.replace("https://ahmed-emad-nasr.github.io/ahmed.dev" + (p === "/" ? "/" : p) + location.search + location.hash);
  }
</script>
